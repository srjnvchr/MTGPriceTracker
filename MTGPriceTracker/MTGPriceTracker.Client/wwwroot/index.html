<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Price Tracker</title>
    <base href="/" />

    <!-- Google Fonts for MudBlazor -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />

    <!-- MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css" />
    <link href="MTGPriceTracker.Client.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#1a1a2e; flex-direction:column; gap:16px;">
            <div style="font-size:48px;">⚔️</div>
            <div style="color:#b39ddb; font-family:Roboto,sans-serif; font-size:18px; letter-spacing:1px;">
                MTG Price Tracker
            </div>
            <div style="color:#7c7c9c; font-family:Roboto,sans-serif; font-size:14px;">Loading...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- MudBlazor JS -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
    <script src="_content/Blazor-ApexCharts/js/blazor-apexcharts.js"></script>

    <!-- Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
